<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC Notify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-AOxGuZ7s.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DBANYFoT.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (!window.invokeNative) {
        document.body.style.background = '#0a0a0f'
        const types = ['info', 'success', 'warning', 'error']
        const titles = ['Információ', 'Sikeres', 'Figyelmeztetés', 'Hiba']
        const messages = [
          'Ez egy információs értesítés.',
          'A művelet sikeresen végrehajtva!',
          'Figyelem, valami nem stimmel.',
          'Hiba történt a feldolgozás során.',
        ]
        types.forEach((t, i) => {
          setTimeout(() => {
            window.postMessage(
              { action: 'notify', type: t, title: titles[i], message: messages[i], duration: 15000 },
              '*'
            )
          }, i * 400)
        })
      }
    </script>
  </body>
</html>
